name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute deployment paths
        id: paths
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "basepath=" >> "$GITHUB_OUTPUT"
          else
            echo "basepath=/$REPO" >> "$GITHUB_OUTPUT"
          fi
          echo "origin=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.basepath }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.paths.outputs.origin }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
